<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EstudIA</title>

<style>
/* ---------- RESET ---------- */
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: Arial, Helvetica, sans-serif;
}

/* ---------- FUNDO ---------- */
body {
  background-color: #0b1c2d;
  color: white;
  height: 100vh;
}

/* ---------- LAYOUT ---------- */
.container {
  display: grid;
  grid-template-columns: 260px 1fr;
  height: 100vh;
}

/* ---------- SIDEBAR ---------- */
.sidebar {
  background-color: #0f2a44;
  padding: 20px;
  display: flex;
  flex-direction: column;
  gap: 15px;
}

.sidebar h2 {
  margin-bottom: 10px;
  font-size: 18px;
  color: #93c5fd;
}

.box {
  background-color: #0b1c2d;
  padding: 15px;
  border-radius: 10px;
  cursor: pointer;
  border: 1px solid #1e3a5f;
}

.box:hover {
  background-color: #112f4e;
}

/* ---------- ÁREA CENTRAL ---------- */
.main {
  display: flex;
  justify-content: center;
  align-items: center;
}

.chat-container {
  background-color: #0f2a44;
  width: 100%;
  max-width: 700px;
  padding: 40px;
  border-radius: 16px;
  display: flex;
  flex-direction: column;
  gap: 20px;
}

.chat-container h1 {
  text-align: center;
}

.chat-container p {
  text-align: center;
  color: #9ca3af;
}

/* ---------- INPUT ---------- */
textarea {
  width: 100%;
  height: 120px;
  resize: none;
  background-color: #0b1c2d;
  color: white;
  border: 1px solid #1e3a5f;
  border-radius: 10px;
  padding: 15px;
  font-size: 15px;
}

textarea:focus {
  outline: none;
  border-color: #2563eb;
}

/* ---------- BOTÃO ---------- */
button {
  width: 100%;
  padding: 15px;
  background-color: #2563eb;
  border: none;
  border-radius: 10px;
  font-size: 16px;
  color: white;
  cursor: pointer;
}

button:hover {
  background-color: #1e40af;
}
</style>
</head>

<body>

<div class="container">

  <!-- SIDEBAR -->
  <aside class="sidebar">
    <h2>Fontes</h2>

    <div class="box">📄 Enviar PDF</div>
    <div class="box">🌐 Enviar Site</div>
    <div class="box">▶️ Enviar Vídeo</div>
  </aside>

  <!-- ÁREA CENTRAL -->
  <main class="main">
    <div class="chat-container">
      <h1>EstudIA</h1>
      <p>Interface experimental de estudos</p>

      <textarea id="prompt" placeholder="Digite o que você quer estudar..."></textarea>
      <button onclick="enviar()">Enviar</button>
    </div>
  </main>

</div>

<script>
function enviar() {
  const texto = document.getElementById("prompt").value;

  if (texto.trim() === "") {
    alert("Digite algo primeiro.");
    return;
  }

  console.log("Prompt enviado:", texto);

  // Simulação (sem IA)
  alert("Prompt enviado com sucesso!");
  document.getElementById("prompt").value = "";
}
</script>

</body>
</html>
